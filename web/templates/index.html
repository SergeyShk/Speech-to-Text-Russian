<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <title>
            Reconocedor
        </title>
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
    </head>
    <body>
        <h1 class="h1 text-primary">Демо-стенд распознавания речи</h1>
        <img class="logo" src="{{ url_for('static', filename='images/logo.jpg') }}" alt="Speech Recognition" />
        <form method="POST" action="/results" enctype="multipart/form-data">
            <ul>
                <li>Поддерживаемые форматы: .wav</li>
                <li>Максимальный размер файла: 20 Мб</li>
            </ul>
            <div class="input-group mb-3">
                <input class="form-control" type="file" id="file" name="file" accept=".wav,audio/wav,audio/x-wav" required />
                <button class="btn btn-warning" type="reset">Сброс</button>
            </div>
            <p class="h4 text-info">Параметры:</p>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="plotWaveform" name="plotWaveform" checked />
                <label class="form-check-label" for="plotWaveform">Визуализировать аудио</label>
            </div>
            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary">Загрузить</button>
            </div>
            {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert alert-danger">
                    {% for message in messages %}
                        <strong>Внимание!</strong> {{ message }}
                    {% endfor %}
                </div>
            {% endif %}
            {% endwith %}
        </form>
    </body>
</html>
