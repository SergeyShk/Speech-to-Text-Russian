[project]
name = "stt-ru"
version = "0.3.0.dev9"
description = "Russian speech recognition: Python library, command line tool, web service and Docker image"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Шкарин Сергей", email = "kouki.sergey@gmail.com" }]
maintainers = [{ name = "Шкарин Сергей", email = "kouki.sergey@gmail.com" }]
keywords = [
    "ASR",
    "speech recognition",
    "speech-to-text",
    "STT",
    "transcription",
    "subtitles",
    "GigaAM",
    "russian",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
    "Natural Language :: Russian",
]
dependencies = [
    "numpy>=1.26",
    "onnx-asr[cpu,hub]>=0.12,<0.13",
    "soundfile>=0.12.1",
]

[project.optional-dependencies]
eval = ["jiwer>=3.0.3"]
ffmpeg = ["imageio-ffmpeg>=0.6"]
service = ["fastapi>=0.115", "python-multipart>=0.0.18", "starlette>=0.39", "uvicorn>=0.30"]

[project.scripts]
stt-ru = "stt_ru.cli:main"

[project.urls]
Homepage = "https://github.com/SergeyShk/Speech-to-Text-Russian"
Repository = "https://github.com/SergeyShk/Speech-to-Text-Russian"
Documentation = "https://sergeyshk.github.io/Speech-to-Text-Russian/"
Issues = "https://github.com/SergeyShk/Speech-to-Text-Russian/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stt_ru"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE.txt"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[dependency-groups]
test = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "imageio-ffmpeg>=0.6",
    "jiwer>=3.0.3",
    "pysubs2>=1.7",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "python-multipart>=0.0.18",
    "starlette>=0.39",
    "uvicorn>=0.30",
]
lint = ["mypy>=1.14", "pre-commit>=4.0", "ruff>=0.9"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-static-i18n>=1.2",
    "pymdown-extensions>=10.0",
]
notebooks = [
    "httpx>=0.27",
    "ipywidgets>=8.1",
    "jupyterlab>=4.3",
    "matplotlib>=3.9",
    "nbconvert>=7.17",
    "nbmake>=1.5",
    "nbstripout>=0.8",
    "pandas>=2.2",
    "pyarrow>=17",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
]

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src", "tests"]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C90",  # mccabe
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "PERF", # perflint
    "PTH",  # flake8-use-pathlib
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.isort]
known-first-party = ["stt_ru"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N801", "N802"]

[tool.mypy]
python_version = "3.11"
files = ["src/stt_ru"]
pretty = true
show_traceback = true
color_output = true
allow_redefinition = false
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
ignore_missing_imports = true
implicit_reexport = false
no_implicit_optional = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
strict_equality = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-v --strict-markers --strict-config --doctest-modules"
testpaths = ["tests", "src/stt_ru"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
markers = [
    "network: тест скачивает модель из сети; отключается через -m 'not network'",
]

[tool.coverage.run]
source = ["stt_ru"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
