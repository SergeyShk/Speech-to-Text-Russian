name: notebooks

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebooks:
    runs-on: ubuntu-latest
    env:
      HF_HOME: ${{ github.workspace }}/.hf
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --all-extras --group notebooks
      - name: Run notebooks
        run: uv run --no-sync pytest --nbmake --nbmake-timeout=900 notebooks -p no:cacheprovider
